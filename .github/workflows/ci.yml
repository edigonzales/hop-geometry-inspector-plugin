name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -U -B -ntp verify

      - name: Verify shared geometry runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-0.1.0-SNAPSHOT.zip"
          test -f "$ZIP"
          unzip -l "$ZIP" > /tmp/inspector-zip.txt

          if grep -E '(^|/)(hop-geometry-type[^/]*\.jar|jts-core[^/]*\.jar|dependencies\.xml)$' /tmp/inspector-zip.txt; then
            echo "Inspector ZIP must not package the shared geometry runtime or dependencies.xml" >&2
            exit 1
          fi

      - name: Checkout geometry type plugin
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          ref: main
          path: geometry-type-source

      - name: Build geometry type install ZIP
        run: mvn -U -B -ntp -f geometry-type-source/pom.xml -DskipTests package

      - name: Verify installed Hop plugin classloader identity
        shell: bash
        run: |
          set -euo pipefail

          INSTALL_ROOT="$RUNNER_TEMP/hop-installed-plugin-test"
          INSPECTOR_ZIP="assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-0.1.0-SNAPSHOT.zip"
          GEOMETRY_ZIP="geometry-type-source/assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-0.1.0-SNAPSHOT.zip"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"
          test -f "$INSPECTOR_ZIP"
          test -f "$GEOMETRY_ZIP"

          unzip -q "$GEOMETRY_ZIP" -d "$INSTALL_ROOT"
          unzip -q "$INSPECTOR_ZIP" -d "$INSTALL_ROOT"

          test -d "$INSTALL_ROOT/plugins/misc/hop-geometry-type"
          test -d "$INSTALL_ROOT/plugins/misc/hop-geometry-inspector"

          mvn -U -B -ntp -pl integration-tests \
            -Dgeometry.inspector.plugins.dir="$INSTALL_ROOT/plugins" \
            test
