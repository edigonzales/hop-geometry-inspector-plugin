name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout geometry type plugin
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          ref: main
          path: geometry-type-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install geometry type dependency
        run: mvn -U -B -ntp -f geometry-type-source/pom.xml -DskipTests -pl hop-geometry-type -am install

      - name: Build and test
        run: mvn -U -B -ntp verify

      - name: Verify shared geometry runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-0.1.0-SNAPSHOT.zip"
          test -f "$ZIP"
          unzip -l "$ZIP" > /tmp/inspector-zip.txt

          if grep -E '(^|/)(hop-geometry-type[^/]*\.jar|jts-core[^/]*\.jar|dependencies\.xml)$' /tmp/inspector-zip.txt; then
            echo "Inspector ZIP must not package the shared geometry runtime or dependencies.xml" >&2
            exit 1
          fi

      - name: Verify GeoTools 35 CRS runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import pathlib
          import zipfile

          archive = pathlib.Path("assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-0.1.0-SNAPSHOT.zip")
          with zipfile.ZipFile(archive) as plugin:
              names = plugin.namelist()
              required_suffixes = (
                  "/lib/gt-main.jar",
                  "/lib/gt-referencing.jar",
                  "/lib/gt-epsg-hsql.jar",
                  "/lib/indriya.jar",
                  "/lib/unit-api.jar",
                  "/lib/systems-common.jar",
              )
              for suffix in required_suffixes:
                  if not any(name.endswith(suffix) for name in names):
                      raise SystemExit(f"Missing Inspector runtime dependency matching {suffix}")

              gt_main_name = next(name for name in names if name.endswith("/lib/gt-main.jar"))
              with zipfile.ZipFile(io.BytesIO(plugin.read(gt_main_name))) as gt_main:
                  properties_name = "META-INF/maven/org.geotools/gt-main/pom.properties"
                  properties = gt_main.read(properties_name).decode("iso-8859-1")
                  if "version=35.0" not in properties:
                      raise SystemExit(f"Inspector must package GeoTools 35.0, got:\n{properties}")

              indriya_name = next(name for name in names if name.endswith("/lib/indriya.jar"))
              with zipfile.ZipFile(io.BytesIO(plugin.read(indriya_name))) as indriya:
                  service = "META-INF/services/tech.units.indriya.spi.NumberSystem"
                  if service not in indriya.namelist():
                      raise SystemExit(f"Indriya NumberSystem service metadata missing from {indriya_name}")
                  provider = indriya.read(service).decode("utf-8")
                  if "tech.units.indriya.function.DefaultNumberSystem" not in provider:
                      raise SystemExit(f"DefaultNumberSystem provider missing from {service}")

          print("Inspector GeoTools 35 CRS runtime packaging OK")
          PY

      - name: Build geometry type install ZIP
        run: mvn -U -B -ntp -f geometry-type-source/pom.xml -DskipTests package

      - name: Verify installed Hop plugin classloader identity
        shell: bash
        run: |
          set -euo pipefail

          INSTALL_ROOT="$RUNNER_TEMP/hop-installed-plugin-test"
          INSPECTOR_ZIP="assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-0.1.0-SNAPSHOT.zip"
          GEOMETRY_ZIP="geometry-type-source/assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-0.1.0-SNAPSHOT.zip"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"
          test -f "$INSPECTOR_ZIP"
          test -f "$GEOMETRY_ZIP"

          unzip -q "$GEOMETRY_ZIP" -d "$INSTALL_ROOT"
          unzip -q "$INSPECTOR_ZIP" -d "$INSTALL_ROOT"

          test -d "$INSTALL_ROOT/plugins/misc/hop-geometry-type"
          test -d "$INSTALL_ROOT/plugins/misc/hop-geometry-inspector"

          mvn -U -B -ntp -pl integration-tests \
            -Dgeometry.inspector.plugins.dir="$INSTALL_ROOT/plugins" \
            test
