name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-type:
    name: Build geometry type dependency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out geometry type plugin
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          ref: main
          path: geometry-type-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve geometry type version
        id: version
        working-directory: geometry-type-source
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build geometry type dependency ZIP
        run: mvn -U -B -ntp -f geometry-type-source/pom.xml -DskipTests package

      - name: Upload geometry type dependency ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hop-geometry-type-dependency
          if-no-files-found: error
          path: geometry-type-source/assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-*.zip

  lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  verify:
    needs: geometry-type
    uses: ./.github/workflows/verify.yml
    with:
      dependency-artifact-name: hop-geometry-type-dependency
      dependency-version: ${{ needs.geometry-type.outputs.version }}

  installed-e2e:
    name: Verify installed plugin classloaders
    needs: [geometry-type, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download verified Inspector bundle
        uses: actions/download-artifact@v4
        with:
          name: hop-geometry-inspector-plugin-canonical
          path: .ci/inspector

      - name: Download geometry type dependency
        uses: actions/download-artifact@v4
        with:
          name: hop-geometry-type-dependency
          path: .ci/geometry-type

      - name: Download isolated Hop 2.19 client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://downloads.apache.org/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip" || \
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://archive.apache.org/dist/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"
          echo "eb227ffe3386480f5ecb59e1d9fdbb16ace15b9ebd9e02da16cdca2c3cadc869f92275b0f607952fb2c5122986839a5b09b2c5762401dad128d8de6b0394643c  $RUNNER_TEMP/hop.zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/hop.zip" -d "$RUNNER_TEMP/isolated-hop"

      - name: Verify canonical installed plugins and examples
        shell: bash
        run: |
          set -euo pipefail
          inspector_zip="$(find .ci/inspector -type f -name '*.zip' -print -quit)"
          geometry_zip="$(find .ci/geometry-type -type f -name '*.zip' -print -quit)"
          python3 scripts/run-e2e.py --hop-home "$RUNNER_TEMP/isolated-hop/hop" \
            --plugin-zip "$inspector_zip" --geometry-zip "$geometry_zip"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, installed-e2e]
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@main
    with:
      ci-ref: main
      repository-kind: snapshot
      verified-artifact-name: hop-geometry-inspector-plugin-canonical
      pom-file: pom.xml
      zip-descriptors: >-
        [{"artifactId":"hop-geometry-inspector-plugin","zipGlob":"assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-*.zip","pluginRoot":"plugins/misc/hop-geometry-inspector"}]
      group-id: ch.so.agi
      hop-version: 2.19.0
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
