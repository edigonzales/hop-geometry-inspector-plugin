name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -U -B -ntp verify

      - name: Verify shared geometry runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-0.1.0-SNAPSHOT.zip"
          test -f "$ZIP"
          unzip -l "$ZIP" > /tmp/inspector-zip.txt

          if grep -E '(^|/)(hop-geometry-type[^/]*\.jar|jts-core[^/]*\.jar|dependencies\.xml)$' /tmp/inspector-zip.txt; then
            echo "Inspector ZIP must not package the shared geometry runtime or dependencies.xml" >&2
            exit 1
          fi
