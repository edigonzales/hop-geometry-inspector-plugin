name: Verify Geometry Inspector plugin

on:
  workflow_call:
    inputs:
      dependency-artifact-name:
        required: false
        type: string
        default: ''
      dependency-version:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp -DgeometryInspector.swtSmoke=true
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      artifact-name-prefix: hop-geometry-inspector-plugin
      dependency-artifact-name: ${{ inputs.dependency-artifact-name }}
      dependency-artifact-path: .ci/dependencies
      dependency-group-id: ch.so.agi
      dependency-artifact-id: hop-geometry-type
      dependency-version: ${{ inputs.dependency-version }}
      dependency-jar-glob: plugins/misc/hop-geometry-type/*.jar
      artifacts: >-
        [{"file":"assemblies/assemblies-hop-geometry-inspector/target/hop-geometry-inspector-plugin-*.zip"}]
      validation-command: |
        python3 scripts/verify-package.py
    secrets: inherit
